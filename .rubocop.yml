plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3

# ================ Style ===============
# TODO: Activate later
Style/Documentation:
  Enabled: false

# ================ LAYOUT ==============
Layout/LineLength:
  Max: 150

# ================ LINT ================
Lint/AmbiguousBlockAssociation:
  Exclude:
    - spec/**/*_spec.rb

# ================ Metics ================
Metrics/BlockLength:
  Exclude:
    - spec/**/*_spec.rb
    - snfoil.gemspec

# ================ NAMING ================
# save/destroy return booleans to match the ORM adapter API they wrap
Naming/PredicateMethod:
  AllowedMethods:
    - call
    - save
    - destroy

# ================ RSPEC ================
RSpec/SpecFilePathFormat:
  CustomTransform:
    SnFoil: snfoil
    CRUD: crud

RSpec/MultipleExpectations:
  Max: 5

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NestedGroups:
  Max: 5

RSpec/SubjectStub:
  Enabled: false